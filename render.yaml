services:
  - type: web
    name: agencyos
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Sin esto Express usa el modo de desarrollo y devuelve el stack trace completo al cliente
      # ante un error sin manejar (rutas de archivos y estructura de módulos del servidor).
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: STORAGE_LIMIT_GB
        value: "9"
